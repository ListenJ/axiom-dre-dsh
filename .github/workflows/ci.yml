name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: "1.3.14"

jobs:
  test:
    name: Typecheck, Build & Tests (self-contained, real MCP smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build bridge
        run: bun run build

      - name: Verify lib/ is in sync with src
        run: |
          git diff --exit-code lib || { echo "::error::lib/ is out of sync with src. Run: bun run build, then commit the regenerated lib."; exit 1; }

      - name: Verify bundled backend is runnable
        run: |
          test -f backend/server.js && head -c 20 backend/server.js | grep -q '@bun'
          echo "backend/server.js present"

      - name: Tests (self-contained; smoke spawns backend/server.js and calls dre__dre_status)
        run: bun test --timeout 60000 tests/
        env:
          NODE_ENV: test
  npm-build:
    name: npm install + build + pack (Node.js path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install via npm
        run: npm install --no-audit --no-fund

      - name: Build via npm (tsc)
        run: npm run build

      - name: Verify npm tarball (lib + backend + README + patch)
        run: npm pack --dry-run
